<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Consulta qué sembrar según el clima histórico de tu zona en México." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..800;1,400..600&amp;family=Fraunces:wght@500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap" />
    <meta name="theme-color" content="#2D5A3D" />
    <script>
      // Aplica el tema antes de pintar para que no parpadee (misma lógica que src/utils/tema.ts)
      (function () {
        var tema = null
        try { tema = localStorage.getItem('quesiembro-tema') } catch (e) {}
        if (tema !== 'claro' && tema !== 'oscuro') {
          tema = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        }
        document.documentElement.dataset.tema = tema
        if (tema === 'oscuro') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B120E')
      })()
    </script>
    <!-- PWA: íconos generados con `npm run iconos` (scripts/generar-iconos.mjs) -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <!-- iPhone y iPad: ícono, nombre bajo el ícono y abrir sin barra de Safari -->
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="QueSiembro" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="QueSiembro" />
    <title>QUESIEMBRO · Huertos en casa</title>
  </head>
  <body class="bg-shell font-sans text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
