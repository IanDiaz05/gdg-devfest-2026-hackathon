services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      DB_PATH: /app/db/quesiembro.db
    volumes:
      - ./sqlite_data:/app/db
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - quesiembro_internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quesiembro_internal
      - dokploy-network

networks:
  quesiembro_internal:
    driver: bridge
  dokploy-network:
    external: true
